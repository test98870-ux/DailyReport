plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'kr.dailyreport.app'
    compileSdk 36

    defaultConfig {
        applicationId 'kr.dailyreport.app'
        minSdk 26
        targetSdk 36
        versionCode 6
        versionName '2.1.2'
        testInstrumentationRunner 'kr.dailyreport.app.MobileSmokeTest'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
}

dependencies { testImplementation 'junit:junit:4.13.2' }

def sharedPython = layout.buildDirectory.dir('generated/sharedPython')
def stagePythonSources = tasks.register('stagePythonSources', Sync) {
    from(rootProject.file('..')) {
        include 'config.py', 'db.py', 'sources.py', 'pipeline.py', 'article_reader.py', 'sources.json'
    }
    into(sharedPython)
}
chaquopy {
    defaultConfig { version = '3.14' }
    sourceSets { main { srcDir(sharedPython.get().asFile) } }
}
tasks.configureEach {
    if (name != 'stagePythonSources' && name.toLowerCase().contains('python')) {
        dependsOn(stagePythonSources)
    }
}
